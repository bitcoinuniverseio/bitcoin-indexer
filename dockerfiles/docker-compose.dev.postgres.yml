version: '3.7'
services:
  postgres:
    image: "postgres:15"
    # Single service, reached through its published port: use the default bridge
    # instead of a per-project network, which a host-wide "docker network prune"
    # can delete between network creation and container start.
    network_mode: bridge
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
    # Throwaway test database: skip durability so every commit does not wait on a
    # disk flush (the suites commit thousands of rows inside 5 s jest hooks).
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
